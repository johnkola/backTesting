# The same PG* variables the engine, the loader and the Node API read.
spring.application.name=backtest-server
server.port=${PORT:8004}
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:backtest}
spring.datasource.username=${PGUSER:backtest}
spring.datasource.password=${PGPASSWORD:backtest}
# Few and lazy: this database allows 25 connections in all (max_connections),
# shared with the engine, the loader, the worker and the Node API. Hikari's
# default is to open the whole pool and keep it, which alone would take ten.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
# Who this process is, for the audit columns (schema.sql, audit_actor()).
spring.datasource.hikari.connection-init-sql=SELECT set_config('app.actor', '${DB_ACTOR:server}', false)

# The jobs table. A property so the tests can point the service at a copy:
# a job put in the real table would be claimed by the worker that is running.
jobs.table=${JOBS_TABLE:jobs.jobs}

# The browser origin allowed to call this service (the client is cross-origin).
cors.allow-origin=${CORS_ALLOW_ORIGIN:*}

# The UI's maintenance switch, as on the Node API.
maintenance=${MAINTENANCE:}
maintenance.message=${MAINTENANCE_MESSAGE:}

# No static files and no HTML error page: every answer is JSON (ErrorAdvice).
spring.web.resources.add-mappings=false
spring.main.banner-mode=off
