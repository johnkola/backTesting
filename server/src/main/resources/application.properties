# The API: the one port the client, the scripts and Postman call (8001, as it
# has always been). The PG* variables are the ones the engine and the Python
# worker read.
spring.application.name=backtest-server
server.port=${PORT:8001}
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:backtest}
spring.datasource.username=${PGUSER:backtest}
spring.datasource.password=${PGPASSWORD:backtest}
# Few and lazy: this database allows 25 connections in all (max_connections),
# shared with the engine and the Python worker. Hikari's
# default is to open the whole pool and keep it, which alone would take ten.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
# Who this process is, for the audit columns (schema.sql, audit_actor()).
spring.datasource.hikari.connection-init-sql=SELECT set_config('app.actor', '${DB_ACTOR:server}', false)

# The jobs table. A property so the tests can point the service at a copy:
# a job put in the real table would be claimed by the worker that is running.
jobs.table=${JOBS_TABLE:jobs.jobs}

# The browser origin allowed to call this service (the client is cross-origin).
cors.allow-origin=${CORS_ALLOW_ORIGIN:*}

# The UI's maintenance switch: set MAINTENANCE to 1 and health reports
# maintenance whatever the probes say, so the client shows its maintenance page.
maintenance=${MAINTENANCE:}
maintenance.message=${MAINTENANCE_MESSAGE:}

# No static files and no HTML error page: every answer is JSON (ErrorAdvice).
spring.web.resources.add-mappings=false
spring.main.banner-mode=off

# Uploads: the CSV is written here and the Python worker, which mounts the
# same directory at the same path, imports it (imports/ImportsController). No
# size limit of this service's own: a CSV of intraday bars is large, and the
# importer streams it.
uploads.dir=${UPLOAD_SPOOL_DIR:data/uploads}
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

# Trained models on disk, read for the Models page (models/ModelsController).
models.dir=${MODELS_DIR:data/models}

# The Markdown files the Docs tab shows, relative to this directory
# (docs/DocRegistry). The repo root when run from it; /app/docs in the image.
docs.dir=${DOCS_DIR:.}

# Where the browser reaches the client: `/` and the old doc URLs redirect there.
client.url=${CLIENT_URL:http://localhost:3000}
