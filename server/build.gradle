// The Spring Boot service: the single backend the design calls for (G16 step
// 16.3; Architecture §2, §6; R48). It serves REST over the database and hands
// work to the compute workers through the jobs table. It never computes.
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bazarbozorg'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // The tests read the service's JSON, and the Postman collection, as a
    // caller would: with a parser that is not the service's own.
    testImplementation 'com.google.code.gson:gson:2.14.0'
    // One test listens for the NOTIFY an insert sends, which is a driver call.
    testImplementation 'org.postgresql:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

bootJar {
    archiveFileName = 'backtest-server.jar'
}
