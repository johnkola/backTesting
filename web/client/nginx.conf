server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: react-router owns /sources, /results/:id and friends, so a
    # direct page load or refresh on one of those must still be handed
    # index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames change on every build, so they can be cached hard.
    # index.html must not be, or a deploy leaves browsers on the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
