# Only John changes docs/: he edits the originals on Google Drive and the nightly
# Drive sync copies them here with a commit whose subject starts with PREFIX.
# Any other commit that touches docs/ fails this check; on the default branch the
# change is also undone automatically. Set up for John, Nov 27, 2026.
name: docs-guard
on:
  push:
  pull_request:
permissions:
  contents: write
env:
  PREFIX: "Docs from Drive"
jobs:
  docs-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Only the Drive sync may change docs/
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          REF: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then BASE="$PR_BASE"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            BASE=$(git merge-base "origin/$DEFAULT" "$HEAD_SHA")
          else BASE="$BEFORE"; fi
          bad=""
          for c in $(git rev-list --reverse --no-merges "$BASE..$HEAD_SHA"); do
            git diff-tree --no-commit-id --name-only -r "$c" | grep -q '^docs/' || continue
            subject=$(git log -1 --format=%s "$c")
            case "$subject" in "$PREFIX"*) ;; *) bad="$bad $c"; echo "::error::$c changes docs/ but is not the Drive sync: $subject";; esac
          done
          [ -z "$bad" ] && { echo "docs/ untouched, or changed only by the Drive sync."; exit 0; }
          if [ "$EVENT" = push ] && [ "$REF" = "$DEFAULT" ]; then
            git config user.name "docs-guard"; git config user.email "docs-guard@users.noreply.github.com"
            for c in $(echo $bad | tr ' ' '\n' | tac); do
              git diff "$c^" "$c" -- docs/ | git apply -R --index
            done
            git commit -m "$PREFIX — docs-guard: undo docs/ changes made outside the Drive sync ($(echo $bad | wc -w) commit(s))"
            git push origin "HEAD:$DEFAULT"
            echo "::error::docs/ changes undone on $DEFAULT."
          fi
          exit 1
