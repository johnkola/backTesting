# Every test suite in the repo, on every push and pull request (DESIGN-GAPS G15).
#
# Four jobs, one per stack, so a failure names the stack that broke:
#   python  loader + nn, against a real TimescaleDB (the round-trip tests are
#           the ones a fake cursor cannot check)
#   java    the engine, against its own TimescaleDB
#   api     the Node layer: node --test and ESLint
#   client  the React client: ESLint, tsc + vite build, Vitest
#
# The database starts empty. schema.sql is applied with psql for the Python
# job (in the running stack the Java engine applies it at startup, and the
# Java tests still do that themselves). Tests that need data seed their own
# and remove it, so an empty database runs every test: none of them skip.
#
# No lockfiles: both package-lock.json files are gitignored (344b38d), so
# the Node jobs use `npm install` and cache on package.json.
#
# Not gated: ruff. `ruff check loader tests` has errors that predate CI;
# gate it once they are cleared, or it would fail every run from day one.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: backtest
          POSTGRES_USER: backtest
          POSTGRES_PASSWORD: backtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U backtest -d backtest"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: backtest
      PGUSER: backtest
      PGPASSWORD: backtest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install (CPU-only torch first, as the loader image does)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[dev]"
      - name: Apply schema.sql
        run: psql -v ON_ERROR_STOP=1 -q -f ../src/main/resources/schema.sql
      - name: pytest
        run: python -m pytest -q -rs

  java:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: backtest
          POSTGRES_USER: backtest
          POSTGRES_PASSWORD: backtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U backtest -d backtest"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGDATABASE: backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # gradlew is stored without the executable bit, so run it through sh.
      - name: gradle test
        run: sh ./gradlew test --no-daemon
      - name: Test report
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, re
          t = s = f = e = 0
          for p in glob.glob("build/test-results/test/*.xml"):
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"',
                            open(p).read(800))
              a, b, c, d = map(int, m.groups()); t += a; s += b; f += c; e += d
          print(f"tests {t}  skipped {s}  failures {f}  errors {e}")
          EOF

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/api/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      # Some tests read files elsewhere in the checkout (the docs registry
      # against the Dockerfile, the Postman collection), so run from web/api
      # inside the full checkout.
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/client/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - name: tsc + vite build
        run: npm run build
      - run: npm test
