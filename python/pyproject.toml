[project]
name = "backtest-loader"
version = "0.1.0"
description = "Python loader service for the backtesting project. Owns CSV import, multi-timeframe aggregation, and (later) NN training/inference."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "numpy>=2.0",
    "torch>=2.6",
]

[project.scripts]
backtest-ingest = "loader.ingest:main"
backtest-audit = "loader.audit:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["loader*", "nn*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
