[project]
name = "backtest-loader"
version = "0.1.0"
description = "Python loader service for the backtesting project. Owns CSV import, multi-timeframe aggregation, and (later) NN training/inference."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "numpy>=2.0",
    "torch>=2.6",
    # The tree engines (B9, G35). xgboost-cpu is XGBoost without the CUDA
    # libraries the plain wheel pulls in; both are trained through their native
    # APIs, so neither needs scikit-learn.
    "xgboost-cpu>=2.1",
    "lightgbm>=4.5",
    # The one source of technical indicators (R66, G78; nn/ta.py). The wheel
    # carries the TA-Lib C library, so the image needs nothing installed for it.
    "TA-Lib>=0.6",
    # The fold's network exported to ONNX for the prediction check the Java
    # side runs in ONNX Runtime (R62, G77; nn/onnx_export.py). onnxscript is
    # what torch's exporter is built on. ONNX Runtime itself is not needed
    # here: the tests use it when it is installed.
    "onnx>=1.17",
    "onnxscript>=0.2",
]

[project.scripts]
backtest-ingest = "loader.ingest:main"
backtest-audit = "loader.audit:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["loader*", "nn*", "jobs*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# With -n (pytest-xdist), each test file runs whole in one process, and the
# files tests/conftest.py groups (TOGETHER) in one; without -n, one process.
addopts = "--dist loadgroup"
