# QQQ on synthetic hourly bars (tools/datagen), for building the intraday path
# before any intraday data is bought (G22, phase two). Not market data: the bars
# are generated from QQQ's daily history.
#
# Everything but the calendar comes from features.toml (G22 I3, the author's
# choice 2026-11-18): the same 37 features and checks. QQQ's own series move to
# the synthetic bars; every other series stays daily and reaches the hourly bars
# from the session after it was known (nn/feature_build.py, `cadence`).
# Windows in [defaults] count rows of their cadence: bars for QQQ's own columns,
# sessions for the daily ones.
inherit = "features.toml"

[alignment]
calendar_symbol = "QQQ"
calendar_source = "synthetic"
calendar_timeframe = "H1"

[remap]
"QQQ/yahoo-adj" = "QQQ/synthetic"
