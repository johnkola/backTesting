# ─────────────────────────────────────────────────────────────────────────────
# DATA CHECKS — a computed column against a published one
# ─────────────────────────────────────────────────────────────────────────────
# The design asks for two of these in so many words, and they share a shape:
# compute something ourselves, import the vendor's own version of the same
# number, and flag the days they disagree.
#
#   Features.md 23 (wired below): "the feature is computed from the two yields
#   above. The published spread (FRED T10Y2Y) is imported too, only as a
#   cross-check: any day where computed and published values differ is flagged
#   as a possible data problem."
#
#   Features.md 7-8 (not wired yet): MACD and RSI "computed from our own prices,
#   then compared with values published by a data API (e.g. Twelve Data) ... The
#   first weeks of a series can differ slightly because moving averages depend
#   on their starting point, so the comparison skips that warm-up." That one
#   needs an external API client, which is why `warmup_days` exists here now
#   rather than being invented later.
#
# WHAT IS COMPARED. The feature's RAW aligned series — after alignment onto the
# calendar, before normalization. Comparing normalized output would be
# meaningless: a z-score of the spread and a z-score of the published spread are
# fitted on different windows and would disagree by construction.
#
# A check NEVER blocks the build. It is a reading about data quality, like the
# cohesion report on an import, and the right response to "17 days disagree" is
# to go and look at those days, not to lose the table.
#
# FIELDS
#   name          unique; what the report calls it.
#   feature       the feature whose raw series is the computed side. Must be a
#                 [[feature]] defined above. A disabled feature's check is
#                 skipped, and its `published` series is not required to load.
#   published     series spec for the vendor's version, same shape as a
#                 feature's `series`.
#   tolerance     how far apart the two may be before a day is flagged, in the
#                 series' OWN units (so 0.02 here is two basis points).
#   warmup_days   skip this many leading calendar days before comparing, for a
#                 statistic whose start value depends on where the series began.

[[check]]
name = "yield_curve_vs_published"
feature = "yield_curve_10y2y"
published = { symbol = "T10Y2Y", source = "fred", field = "close" }
tolerance = 0.02
warmup_days = 0
note = """Two basis points, and the measurement says that is the right number.
FRED publishes DGS10, DGS2 and T10Y2Y each rounded to two decimals, so
subtracting two rounded numbers can legitimately sit 0.01 off the independently
rounded spread.

Measured over the full 6,930-day calendar: exactly ONE day disagrees by more
than 1e-12 -- 2026-09-25, computed 0.37 against published 0.36 -- and the mean
absolute difference is 1.44e-06, which is that single day spread across the
history (0.01 / 6930). So 0.02 admits the one real rounding day and nothing
else; tightening to 0.005 would flag it falsely, and loosening further would
start hiding genuine single-bar errors.

No warm-up: a subtraction has no window to fill, unlike MACD.

Coverage disagreement is reported separately from value disagreement. Measured
at zero on both sides here -- after alignment the two legs and the published
spread cover identical days -- but it is the half worth watching, because a day
where only one side has a value is a gap in a series rather than a wrong number
in either, and it has a different fix."""
