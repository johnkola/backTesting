# Feature table for the QQQ model — the single place where normalization is chosen.
#
# Each [[feature]] block is one column the pipeline can produce. The knob you
# most likely came here to turn is `method`: it selects how that column is made
# scale-free and stationary. Change it, bump `schema_version` below, retrain.
#
# `enabled = false` keeps a column defined and documented without feeding it to
# the network. That is how the price-derived indicators (RSI, MACD, realized
# volatility) stay available to the Ta4j strategies and the charts while staying
# out of the model, and how a blocked or undecided column keeps its place in the
# table rather than vanishing from the design.
#
# METHODS
#   ratio_to_prev_close   (x / previous close) - 1.      Params: none.
#                         On the close column this is exactly the daily return.
#   daily_return          (x / previous x) - 1.          Params: none.
#                         Undefined across zero — never use it on a series that
#                         can go negative (oil did, on 2020-04-20; the yield
#                         curve does on 2,079 days of its history).
#   daily_change          x - previous x, in the series' own units.
#                         The right choice for a yield already quoted in percent.
#   rolling_zscore        (x - mean(window)) / stdev(window). Params: window.
#                         Causal: uses only trailing data, so it is safe to
#                         precompute and store.
#   ratio_to_rolling_mean x / mean(window).              Params: window.
#   rescale               (x - min) / (max - min).       Params: min, max.
#                         Only for a genuinely fixed, known range. Not a
#                         data-driven min/max — that would leak.
#   cyclical              sin and cos of the position in the cycle. Params:
#                         period. Emits TWO values, not one.
#   flag                  0 or 1. Params: none.
#   passthrough           No transform. Use only on something already bounded
#                         and stationary.
#
# LEAKAGE RULE — every method above is causal: a row's value depends only on
# that column's own past. That is what makes the output safe to precompute into
# the database. The train-slice-fitted scaler (min-max today) is NOT causal and
# deliberately does not live here; it is fitted per walk-forward fold at
# training time and must stay there.

#
# CATALOGUE FIELDS — what the Features tab shows about each column, required on
# every feature (Architecture.md §8.2a, "Feature definition columns").
#   scope    instrument | market. `instrument` means the column is computed
#            from the chosen instrument's own bars and follows it when the
#            instrument changes; `market` means it is shared and stays selected.
#            Running AAPL instead of QQQ therefore needs no manual exclusion.
#   cadence  daily | weekly | monthly | quarterly — the series' NATIVE
#            publication rate. Everything here is daily today. A run at a finer
#            timeframe carries a coarser feature forward from its publication
#            timestamp, which is impossible without knowing this.
#   cost     free | paid. Sequencing, not accounting: every free column is built
#            before any paid one, so the table works before money is spent.
#   units    percent | level | count | ratio — of the RAW series, not of the
#            normalized output. It is what makes the right `method` obvious (a
#            yield already in percent wants daily_change, not daily_return) and
#            what a chart axis is labelled from.
schema_version = 5

# Bumping schema_version changes the model cache key, so an old model is never
# silently reused against a feature vector built by different rules.


[defaults]
# Used by any feature that does not override them.
zscore_window = 60
rolling_mean_window = 20
lookback_window = 20      # how many bars of history each training sample sees


[alignment]
# The instrument whose trading days define the rows of the feature table.
# Every other series is aligned onto this calendar.
calendar_symbol = "QQQ"
calendar_source = "yahoo-adj"
calendar_timeframe = "D1"

# What to do when an aligned series has no observation on a calendar day.
# "forward"  carry the last known value (the right call for a level: a yield
#            that did not print on Columbus Day has not changed)
# "drop"     drop the whole row
# "error"    refuse to build
fill = "forward"

# Refuse to carry a value further than this. A longer hole means the series is
# genuinely broken, not merely closed for a holiday, and should fail loudly.
max_fill_days = 5

# Measured gaps against QQQ's 5,971 trading days since 2003, for reference:
#   NDXBREADTH, VIX, VXN, SPY   0      exact match
#   DXY                         2
#   COPPER / GOLD              13 / 14 futures holidays
#   T10Y2Y, T10YIE             43      bond holidays when equities trade
#   DGS10                      44
#   DCOILWTICO                330      the worst case, 5.5%


# ─────────────────────────────────────────────────────────────────────────────
# Price — the raw bar. Four columns, one common base (yesterday's close) so they
# stay comparable and together reconstruct the whole bar's geometry.
# ─────────────────────────────────────────────────────────────────────────────

[[feature]]
name = "price_open"
scope = "instrument"
cadence = "daily"
cost = "free"
units = "level"
series = { symbol = "QQQ", source = "yahoo-adj", field = "open" }
method = "ratio_to_prev_close"
enabled = true
note = "The overnight gap — information the close alone throws away."

[[feature]]
name = "price_high"
scope = "instrument"
cadence = "daily"
cost = "free"
units = "level"
series = { symbol = "QQQ", source = "yahoo-adj", field = "high" }
method = "ratio_to_prev_close"
enabled = true

[[feature]]
name = "price_low"
scope = "instrument"
cadence = "daily"
cost = "free"
units = "level"
series = { symbol = "QQQ", source = "yahoo-adj", field = "low" }
method = "ratio_to_prev_close"
enabled = true

[[feature]]
name = "price_close"
scope = "instrument"
cadence = "daily"
cost = "free"
units = "level"
series = { symbol = "QQQ", source = "yahoo-adj", field = "close" }
method = "ratio_to_prev_close"
enabled = true
note = "On the close, this is the daily return."

[[feature]]
name = "volume"
scope = "instrument"
cadence = "daily"
cost = "free"
units = "count"
series = { symbol = "QQQ", source = "yahoo-adj", field = "volume" }
method = "ratio_to_rolling_mean"
window = 20
enabled = true


# ─────────────────────────────────────────────────────────────────────────────
# Volatility. VXN's LEVEL is the signal — 15 versus 45 is the whole point — so
# these are z-scored rather than turned into returns, which would discard it.
# ─────────────────────────────────────────────────────────────────────────────

[[feature]]
name = "vxn_open"
scope = "market"
cadence = "daily"
cost = "free"
units = "level"
series = { symbol = "VXN", source = "yahoo", field = "open" }
method = "rolling_zscore"
window = 60
enabled = true

[[feature]]
name = "vxn_high"
scope = "market"
cadence = "daily"
cost = "free"
units = "level"
series = { symbol = "VXN", source = "yahoo", field = "high" }
method = "rolling_zscore"
window = 60
enabled = true

[[feature]]
name = "vxn_low"
scope = "market"
cadence = "daily"
cost = "free"
units = "level"
series = { symbol = "VXN", source = "yahoo", field = "low" }
method = "rolling_zscore"
window = 60
enabled = true

[[feature]]
name = "vxn_close"
scope = "market"
cadence = "daily"
cost = "free"
units = "level"
series = { symbol = "VXN", source = "yahoo", field = "close" }
method = "rolling_zscore"
window = 60
enabled = true
note = "How stretched fear is versus its own recent history."

[[feature]]
name = "vxn_vix_spread"
scope = "market"
cadence = "daily"
cost = "free"
units = "level"
series = { op = "subtract", a = { symbol = "VXN", source = "yahoo", field = "close" }, b = { symbol = "VIX", source = "yahoo", field = "close" } }
method = "rolling_zscore"
window = 60
enabled = true
note = "Tech-specific fear above broad-market fear."

[[feature]]
name = "vix"
scope = "market"
cadence = "daily"
cost = "free"
units = "level"
series = { symbol = "VIX", source = "yahoo", field = "close" }
method = "rolling_zscore"
window = 60
enabled = true
note = """Broad-market fear in its own right, not just the subtrahend in
vxn_vix_spread. The spread says how much EXTRA fear is aimed at tech; it is
blind to whether the whole market is calm or terrified, which this restores."""


# ─────────────────────────────────────────────────────────────────────────────
# Price-derived indicators — DATA ONLY.
#
# These stay out of the network on purpose. The model already sees the full raw
# bar, so it can learn whatever a windowed transform of that bar encodes;
# feeding it in again adds dimensions and overfitting room without adding
# information. The dividing line is the lookback window: a raw bar is an
# observation and goes in, anything averaged over trailing days is a derivation
# and stays out. To test that belief, set `enabled = true` and remove the status.
#
# `status = "data-only"` is what keeps them built: Features.md B has them
# "computed and stored for charts and rule-based strategies, but kept out of the
# network". So the build stores them in every feature set, with role `data` in
# `feature_spec`, and nothing that feeds the network reads that role. Any other
# disabled column is not built at all.
# ─────────────────────────────────────────────────────────────────────────────

[[feature]]
name = "rsi_14"
scope = "instrument"
cadence = "daily"
cost = "free"
units = "percent"
series = { computed = "rsi", symbol = "QQQ", source = "yahoo-adj", period = 14 }
method = "rescale"
min = 0.0
max = 100.0
enabled = false
status = "data-only"

[[feature]]
name = "macd"
scope = "instrument"
cadence = "daily"
cost = "free"
units = "level"
series = { computed = "macd", symbol = "QQQ", source = "yahoo-adj", short = 12, long = 26 }
method = "rolling_zscore"
window = 60
enabled = false
status = "data-only"

[[feature]]
name = "realized_vol"
scope = "instrument"
cadence = "daily"
cost = "free"
units = "percent"
series = { computed = "realized_vol", symbol = "QQQ", source = "yahoo-adj", period = 20 }
method = "rolling_zscore"
window = 60
enabled = false
status = "data-only"


# ─────────────────────────────────────────────────────────────────────────────
# Rates, inflation and commodities.
# ─────────────────────────────────────────────────────────────────────────────

[[feature]]
name = "treasury_10y"
scope = "market"
cadence = "daily"
cost = "free"
units = "percent"
series = { symbol = "DGS10", source = "fred", field = "close" }
method = "daily_change"
enabled = true
note = "Already quoted in percent, so a change in points is the natural unit."

[[feature]]
name = "treasury_2y"
scope = "market"
cadence = "daily"
cost = "free"
units = "percent"
series = { symbol = "DGS2", source = "fred", field = "close" }
method = "daily_change"
enabled = true
note = """Short-rate expectations — what the market thinks the Fed will do —
which drive tech valuations directly. Same units as treasury_10y, so the same
daily_change. Note this is DGS2, not the DTB3 3-month bill also on disk:
3-month and 2-year are different instruments and DTB3 is not referenced here."""

[[feature]]
name = "fed_funds"
scope = "market"
cadence = "daily"
cost = "free"
units = "percent"
series = { symbol = "DFF", source = "fred", field = "close" }
method = "rescale"
min = 0.0
max = 25.0
enabled = true
note = """Features.md 41. The Fed's overnight policy rate: the realized cost of
short-term money, where treasury_2y is the market's GUESS at where it goes next.
Both earn a place only because they differ -- DGS2 moves daily on expectations,
DFF moves only when the Fed actually acts.

Dual role, and the second one is why it is here now: Features.md calls it "the
benchmark brokers use for USD margin, so the same raw series feeds the margin
interest cost". Design Notes requires Strategy 2 to charge "a variable rate
tracking each historical period's rate environment, not one fixed figure", and
this is that series. The raw bars serve the margin cost; this normalized column
is the separate question of whether the model should SEE the policy rate.

RESCALE, not daily_change like its neighbours, and not rolling_zscore. A policy
rate is a staircase: flat for months, then a 25-75bp step. daily_change would be
0.0 on roughly every day and carries what DGS2 already says better. A 60-day
rolling z-score is worse than it looks -- across a long hold the window is flat,
which rolling_zscore reports as 0.0 ("not unusual"), so the column says nothing
for months and then spikes on a single step. The level is the signal the doc
describes, and 0..25 is a genuinely declared band, not a fitted one: daily DFF
has run between 0.04 and 22.36 since 1954 (above 20 on 27 days, 1980-12-11 to
1981-07-23; 19.10 is the high of the MONTHLY FEDFUNDS, a different series, which
is what the old 0..20 band was sized on). Since 2003 it has not passed 5.41, so
the column sits in the bottom quarter of the band. rescale does not clip, so a
breach would show up as a value outside 0..1 rather than hide.

Enabled 2026-11-10, once DFF was in the store (1954-07-01 to 2026-11-06,
26,427 daily bars, INDEX, source fred). It shipped off until then because a
column enabled before its data exists builds all-NULL, and read_matrix drops
every date where any column is NULL -- the whole table would vanish. That is the
trap breakeven_inflation documents below.

To refresh it:

    python fetch_fred_series.py DFF
    curl -F file=@test-data/DFF_daily.csv -F symbol=DFF -F type=INDEX          -F timeframe=D1 -F source=fred http://localhost:8001/api/imports

No API key needed: DFF is Fed-published, not one of the licensed ICE BofA
series the free graph endpoint truncates. INDEX, not STOCK, so the engine
cannot open a position in a policy rate. DFF reaches back to 1954-07-01, so
unlike breakeven_inflation it cannot move the training floor."""

[[feature]]
name = "boc_policy_rate"
scope = "market"
cadence = "daily"
cost = "free"
units = "percent"
series = { symbol = "CORRA", source = "boc", field = "close" }
method = "rescale"
min = 0.0
max = 25.0
enabled = true
note = """Features.md 42. Canada's overnight rate: Canadian monetary conditions and
the CAD side of borrowing costs for a Canadian account.

CORRA, the Canadian Overnight Repo Rate Average (Bank of Canada Valet series
AVG.INTWO), daily from 1997-08-12. Features.md asks for the overnight TARGET; this
is the realised overnight rate the target steers, the Canadian counterpart of
fed_funds (DFF), and it tracks the target within a few basis points. The target
itself is daily only from 2009-04-21 (Valet V39079); before that the Bank publishes
it monthly. Enabling a 2009 column would set the training floor for the whole
table (the trap breakeven_inflation documents), and stitching month-end values in
front of it would either look ahead or lag a change by up to a month. CORRA's
methodology was enhanced in June 2020; the level moved by basis points, which
this rescale cannot see.

RESCALE on the same declared 0..25 band as fed_funds, for the same reasons -- a
policy rate is a staircase, so the level is the signal, and daily_change or a
rolling z-score would read 0 for months and spike on a step -- and so that the two
policy rates sit on one scale, where their difference is the US-Canada rate gap.
Since 1997 it has run between 0.05 (2021-12-10) and 6.02 (1998-10-30), so the
column stays in the bottom quarter of the band; rescale does not clip, so a breach
would show outside 0..1.

It does not print on Canadian holidays (Thanksgiving, Remembrance Day, ...), which
the NYSE calendar trades through, so those gaps are expected and the build carries
the last value forward.

To refresh it:

    python fetch_boc_series.py AVG.INTWO --out test-data/CORRA_daily.csv
    curl -F file=@test-data/CORRA_daily.csv -F symbol=CORRA -F type=INDEX          -F timeframe=D1 -F source=boc http://localhost:8001/api/imports"""

[[feature]]
name = "breakeven_inflation"
scope = "market"
cadence = "daily"
cost = "free"
units = "percent"
series = { symbol = "T10YIE", source = "fred", field = "close" }
method = "daily_change"
enabled = false
status = "short-history"
note = """T10YIE starts 2003-01-02, and read_matrix drops any date where a
column is NULL, so this one column decided the training start for the whole
table: the set holds 6,930 days and only 5,970 survived the drop. Disabled to
get the 1999-2003 head back — every other series reaches further (VIX to 2000,
VXN 6,398 days, gold and copper 6,497, price 6,929).

Re-enable it and the floor returns to 2003. The honest trade is between four
more years of history and one inflation-expectation signal; with it off, the
next-shortest series sets the new floor."""

[[feature]]
name = "yield_curve_10y2y"
scope = "market"
cadence = "daily"
cost = "free"
units = "percent"
series = { op = "subtract", a = { symbol = "DGS10", source = "fred", field = "close" }, b = { symbol = "DGS2", source = "fred", field = "close" } }
method = "rolling_zscore"
window = 60
enabled = true
note = """COMPUTED from the two legs, not read from FRED's published T10Y2Y.
Features.md 23 is explicit about the direction: "the feature is computed from
the two yields above. The published spread (FRED T10Y2Y) is imported too, only
as a cross-check".

The reason is that it buys a free data check on three series at once. Reading
T10Y2Y gave one number nobody could verify; computing DGS10 - DGS2 and holding
the published spread beside it means any disagreement points at a bad or missing
bar in one of the three. See [[check]] yield_curve_vs_published at the foot of
this file -- it flags, it does not block.

Both legs are already required: treasury_10y and treasury_2y read them. The
spread is therefore computed from data the table already depends on, while
T10Y2Y drops out of required_series for the features and is pulled back in by
the check.

Negative on 2,079 days (inversion). Never daily_return on this."""

[[feature]]
name = "oil_wti"
scope = "market"
cadence = "daily"
cost = "free"
units = "level"
series = { symbol = "DCOILWTICO", source = "fred", field = "close" }
method = "rolling_zscore"
window = 60
enabled = true
note = "Printed -36.98 on 2020-04-20. Never daily_return on this."

[[feature]]
name = "dollar_index"
scope = "market"
cadence = "daily"
cost = "free"
units = "level"
series = { symbol = "DXY", source = "yahoo", field = "close" }
method = "rolling_zscore"
window = 60
enabled = true

[[feature]]
name = "copper_gold_ratio"
scope = "market"
cadence = "daily"
cost = "free"
units = "ratio"
series = { op = "divide", a = { symbol = "COPPER", source = "yahoo", field = "close" }, b = { symbol = "GOLD", source = "yahoo", field = "close" } }
method = "rolling_zscore"
window = 60
enabled = true
note = """Closes only. Yahoo's continuous futures are internally inconsistent —
7.4% of GOLD bars and 5.0% of COPPER bars since 2003 have a close outside the
day's own high/low range — so no candle-shaped feature may be built on them."""

[[feature]]
name = "gold"
scope = "market"
cadence = "daily"
cost = "free"
units = "level"
series = { symbol = "GOLD", source = "yahoo", field = "close" }
method = "rolling_zscore"
window = 60
enabled = true
note = """Safe-haven demand on its own, separate from copper_gold_ratio: the
ratio moves on either leg, so a copper collapse and a gold spike look alike in
it. Close only, for the futures-consistency reason noted above. z-score rather
than daily_return follows the dollar_index precedent for the same wording."""


# ─────────────────────────────────────────────────────────────────────────────
# Breadth. Price-derived, but from the other hundred names — information QQQ's
# own series does not contain, which is why these are in the model and RSI is not.
# ─────────────────────────────────────────────────────────────────────────────

[[feature]]
name = "breadth_200dma"
scope = "market"
cadence = "daily"
cost = "free"
units = "percent"
series = { symbol = "NDXBREADTH", source = "computed", field = "close" }
method = "rescale"
min = 0.0
max = 100.0
enabled = true
note = """Survivorship-biased: today's members applied to all history, so past
drawdowns read less broad-based than they were."""

[[feature]]
name = "ndx_dispersion"
scope = "market"
cadence = "daily"
cost = "free"
units = "percent"
series = { symbol = "NDXDISP", source = "computed", field = "close" }
method = "rolling_zscore"
window = 60
enabled = true
note = "Macro-driven versus stock-picking regime. From the cached constituent closes."

[[feature]]
name = "ndx_advance_decline"
scope = "market"
cadence = "daily"
cost = "free"
units = "count"
series = { symbol = "NDXAD", source = "computed", field = "close" }
method = "rolling_zscore"
window = 60
enabled = true
note = "Fast breadth, complementing the slow 200-day measure."

[[feature]]
name = "ndx_new_highs_lows"
scope = "market"
cadence = "daily"
cost = "free"
units = "count"
series = { symbol = "NDXNHNL", source = "computed", field = "close" }
method = "rolling_zscore"
window = 60
enabled = true
note = """Net percent of members at a 252-day (one-year) high minus those at a
low. Another angle on whether strength is spreading, from the same cached
closes. Survivorship-biased like the rest of this family."""


# ─────────────────────────────────────────────────────────────────────────────
# Calendar. No data source — generated from the date itself.
# The cyclical columns emit TWO values each (sin and cos).
# ─────────────────────────────────────────────────────────────────────────────

[[feature]]
name = "day_of_week"
scope = "market"
cadence = "daily"
cost = "free"
units = "count"
series = { computed = "day_of_week" }
method = "cyclical"
period = 7
enabled = true
note = "Period 7 so Sunday wraps to Monday, even though only Mon-Fri appear."

[[feature]]
name = "day_of_year"
scope = "market"
cadence = "daily"
cost = "free"
units = "count"
series = { computed = "day_of_year" }
method = "cyclical"
period = 365.25
enabled = true
note = "So Dec 31 sits next to Jan 1."

[[feature]]
name = "day_of_month"
scope = "market"
cadence = "daily"
cost = "free"
units = "count"
series = { computed = "day_of_month" }
method = "cyclical"
period = 30.44
enabled = true
note = """Month-turn effects: fund flows and rebalancing cluster at the edges.
Period is the mean month length, so the wrap is approximate — the 31st of a
long month and the 1st of the next are close but not adjacent. Exact would need
the position scaled by each month's own length; this is the day_of_year
treatment applied consistently."""

[[feature]]
name = "holiday_proximity"
scope = "market"
cadence = "daily"
cost = "free"
units = "count"
series = { computed = "holiday_proximity", calendar = "NYSE", lookahead_days = 1 }
method = "flag"
enabled = true
note = """Should interact with day_of_week: a holiday making a three-day weekend
drives more position-squaring than a midweek one."""


# ─────────────────────────────────────────────────────────────────────────────
# Credit. The calmer cousin of the high-yield spread, which is blocked below:
# it moves less, but FRED serves its full history instead of three years.
# ─────────────────────────────────────────────────────────────────────────────

[[feature]]
name = "credit_spread_ig"
scope = "market"
cadence = "daily"
cost = "free"
units = "percent"
series = { symbol = "BAA10Y", source = "fred", field = "close" }
method = "rolling_zscore"
window = 60
enabled = true
note = """Features.md 25. Extra yield demanded on high-rated corporates over Treasuries:
when it widens, lenders are getting nervous about corporate health in general.

BAA10Y, Moody's seasoned Baa corporate yield minus the 10-year Treasury, which
Features.md names as the free fallback. The design's first choice, ICE BofA
BAMLC0A0CM, is BLOCKED at the series, not for want of a key: checked 2026-10-12
against the REST API with one, FRED carries it from 2023-10-10 only, with the note
"Starting in April 2026, this series will only include 3 years of observations".
Three years cannot cover a training window that starts in 2003.

Not the same measure. Baa is the lowest investment-grade rating, so this reads
higher and moves more than an all-grades IG index; and it is a yield difference
against the 10-year, not an option-adjusted spread. The direction it carries --
corporate credit tightening or easing against Treasuries -- is what the column is
for, and a rolling z-score reads direction and surprise, not level.

Daily from 1986-01-02 (10,214 bars, imported 2026-11-10 from FRED's table page for
BAA10Y; the graph CSV endpoint is blocked on the build network). It does not print
on US bond-market holidays (Columbus Day, Veterans Day), which the NYSE calendar
does not close for, so those gaps are expected and the build carries the last
value forward. Already a difference, so never daily_return.

To refresh it:

    python fetch_fred_series.py BAA10Y
    curl -F file=@test-data/BAA10Y_daily.csv -F symbol=BAA10Y -F type=INDEX          -F timeframe=D1 -F source=fred http://localhost:8001/api/imports"""

[[feature]]
name = "put_call_ndx"
scope = "market"
cadence = "daily"
cost = "paid"
units = "ratio"
series = { computed = "put_call_ndx" }
method = "rolling_zscore"
window = 60
enabled = false
status = "later-paid"
note = """Per-name options history is paid-only and CBOE's free daily file is
gated behind a 403. Deliberately last: everything free is built and validated
before any money is spent here."""

[[feature]]
name = "vix_term_structure"
scope = "market"
cadence = "daily"
cost = "free"
units = "ratio"
series = { op = "divide", a = { symbol = "VIX3M", source = "yahoo", field = "close" }, b = { symbol = "VIX", source = "yahoo", field = "close" } }
method = "rolling_zscore"
window = 60
enabled = false
status = "undecided"
note = "Yahoo VIX3M starts 2006-07-17, blanking the first three training years."

[[feature]]
name = "credit_spread_hy"
scope = "market"
cadence = "daily"
cost = "paid"
units = "percent"
series = { symbol = "BAMLH0A0HYM2", source = "fred", field = "close" }
