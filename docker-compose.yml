services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: backtest-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: backtest
      POSTGRES_USER: backtest
      POSTGRES_PASSWORD: backtest
      TS_TUNE_MEMORY: 2GB
      TS_TUNE_NUM_CPUS: 2
    # One lock per chunk per parallel worker on a full-table scan, so the
    # default 128 is not enough for a hypertable with a long history — an
    # audit over `candles` fails with "out of shared memory". schema.sql now
    # creates yearly chunks, which keeps the count low, but databases created
    # before that change still carry their old chunks; this is the headroom
    # that keeps them queryable either way.
    command: postgres -c max_locks_per_transaction=1024
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backtest -d backtest"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The single API origin. Reads Postgres directly, proxies writes to the
  # loader and strategy/run calls to the engine, so the client needs one base
  # URL and one CORS origin.
  api:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: backtest-api
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      PGHOST: timescaledb
      PGPORT: 5432
      PGDATABASE: backtest
      PGUSER: backtest
      PGPASSWORD: backtest
      PORT: 8001
      # Upstreams. Both are internal to this network — the browser never talks
      # to either directly.
      LOADER_URL: http://loader:8001
      ENGINE_URL: http://engine:8002
      # Where the browser reaches the client. Used only for redirects — `/` and
      # the old server-rendered doc URLs now point back into the app.
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      # Global maintenance switch for the UI. `MAINTENANCE=1 docker compose up -d api`
      # makes /api/health report maintenance, so the client shows its maintenance
      # page while every service keeps running. Unset it and bring the service up
      # again to return to normal.
      MAINTENANCE: ${MAINTENANCE:-}
      MAINTENANCE_MESSAGE: ${MAINTENANCE_MESSAGE:-}
    volumes:
      - ./data/models:/data/models:ro
      - ./GETTING-STARTED.md:/app/docs/GETTING-STARTED.md:ro
      - ./README.md:/app/docs/README.md:ro
      # The design set, at the path the DOCS registry addresses it by. Quoted
      # because `Design Notes.md` contains a space, and :ro because nothing in
      # this repo may write to read-only-doc/.
      - "./read-only-doc/Architecture.md:/app/docs/read-only-doc/Architecture.md:ro"
      - "./read-only-doc/Design Notes.md:/app/docs/read-only-doc/Design Notes.md:ro"
      - "./read-only-doc/Features.md:/app/docs/read-only-doc/Features.md:ro"

  # The React SPA, static files behind nginx. No backend of its own: it calls
  # the API by the URL baked in at build time.
  client:
    build:
      context: .
      dockerfile: web/client/Dockerfile
      args:
        # Where the browser reaches the API. Baked into the bundle at build
        # time (Vite substitutes import.meta.env at compile time), so changing
        # it means rebuilding this image, not restarting it.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
    container_name: backtest-client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

  # Java: the strategy registry and the backtest engine. Not published — the
  # API service proxies it. Run the CLI from the host for everything else.
  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    container_name: backtest-engine
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    expose:
      - "8002"
    environment:
      PGHOST: timescaledb
      PGPORT: 5432
      PGDATABASE: backtest
      PGUSER: backtest
      PGPASSWORD: backtest
      ENGINE_PORT: "8002"
      LOADER_URL: http://loader:8001
    volumes:
      - ./data/models:/data/models:ro

  loader:
    build:
      context: .
      dockerfile: python/Dockerfile
    container_name: backtest-loader
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      # Container port stays 8001; the host port moved to 8003 because the API
      # service now owns 8001. Published at all only so the host-run Java CLI
      # (`aggregate`, `train`, `run -s nn-feedforward`) can reach it — set
      # LOADER_URL=http://localhost:8003 for those. In-network callers use
      # http://loader:8001 and are unaffected.
      - "8003:8001"
    environment:
      PGHOST: timescaledb
      PGPORT: 5432
      PGDATABASE: backtest
      PGUSER: backtest
      PGPASSWORD: backtest
      CSV_ARCHIVE_DIR: /data/csv-archive
      MODELS_DIR: /data/models
      # Keep-last-N retention for trained NN models. 0 disables retention,
      # matching the Java side's default when --keep-last-N isn't passed.
      MODEL_KEEP_LAST_N: "0"
      # Data feeds (loader/feeds, README "Data feeds"). The daily refresh runs
      # Monday to Friday at these New York times; `off` disables it. The FRED
      # key comes from the gitignored .env; without one, FRED's keyless CSV
      # endpoint is used.
      FEEDS_SCHEDULE: ${FEEDS_SCHEDULE:-18:30}
      FRED_API_KEY: ${FRED_API_KEY:-}
      NDX_CONSTITUENTS_DIR: /data/ndx-constituents
      # The SEC earnings series: SEC asks automated clients to name themselves
      # (.env.example); unset, a generic tool name is sent.
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      NDX_EARNINGS_DIR: /data/ndx-earnings
    volumes:
      # CSV archive — owned by the loader, read by anyone who needs the on-disk
      # slices (the host-side gradle path also writes here through the same mount).
      - ./data/csv-archive:/data/csv-archive
      # Trained NN models. RW because the loader writes new versions; the
      # web service mounts the same host dir read-only above.
      - ./data/models:/data/models
      # Breadth members' daily closes, kept current by the feeds and read by
      # build_ndx_breadth.py on the host.
      - ./data/ndx-constituents:/data/ndx-constituents
      # The members' SEC filings (8-K dates, net income facts), kept current by
      # the feeds and read by build_ndx_earnings.py on the host.
      - ./data/ndx-earnings:/data/ndx-earnings

  # Database UI. Not part of the default stack — it sits behind the `tools`
  # profile, so `docker compose up -d` is unchanged and you ask for this one
  # explicitly:
  #
  #   docker compose --profile tools up -d pgadmin
  #
  # Then http://localhost:5050, log in as admin@backtest.local / backtest. pgAdmin
  # rejects a password under 6 characters, so this default is not `admin`. The
  # server is pre-registered from docker/pgadmin/servers.json, which pgAdmin
  # reads only when its volume is empty — on first start, or after a
  # `docker compose down -v`. Editing that file later has no effect; change
  # the connection in the UI instead.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: backtest-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@backtest.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-backtest}
      # The login above is a local credential, not a mailbox, but pgAdmin
      # validates it as a real address and refuses to start on a reserved
      # domain — `.local` is on that list, and turning off the deliverability
      # checks does not exempt it. Naming the domain here does. Nothing is
      # ever sent to the address.
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: '["local"]'
      # A local tool on a local port — the master password adds a second
      # prompt and protects nothing here.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      # pgAdmin's own settings and saved connections. Named, so the server
      # list and any saved passwords survive a restart.
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  timescaledb-data:
  pgadmin-data:
