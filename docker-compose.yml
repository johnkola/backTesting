services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: backtest-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: backtest
      POSTGRES_USER: backtest
      POSTGRES_PASSWORD: backtest
      TS_TUNE_MEMORY: 2GB
      TS_TUNE_NUM_CPUS: 2
    # One lock per chunk per parallel worker on a full-table scan, so the
    # default 128 is not enough for a hypertable with a long history — an
    # audit over `candles` fails with "out of shared memory". schema.sql now
    # creates yearly chunks, which keeps the count low, but databases created
    # before that change still carry their old chunks; this is the headroom
    # that keeps them queryable either way.
    command: postgres -c max_locks_per_transaction=1024
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backtest -d backtest"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The API (Architecture §2, §6): the Spring Boot service, the one backend the
  # client calls. It reads the database and hands work to the two compute
  # workers through the jobs table; it calls no other service, and neither
  # worker has a port.
  #
  # `MAINTENANCE=1 docker compose up -d server` makes /api/health report
  # maintenance, so the client shows its maintenance page while everything
  # keeps running. Unset it and bring the service up again to return to normal.
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: backtest-server
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      PGHOST: timescaledb
      PGPORT: 5432
      PGDATABASE: backtest
      PGUSER: backtest
      PGPASSWORD: backtest
      PORT: 8001
      DB_ACTOR: server
      MAINTENANCE: ${MAINTENANCE:-}
      MAINTENANCE_MESSAGE: ${MAINTENANCE_MESSAGE:-}
      # Where an uploaded CSV is written for the worker to import. The worker
      # mounts the same host directory at the same path.
      UPLOAD_SPOOL_DIR: /data/uploads
      # Trained models, listed on the Models page; and the Markdown the Docs
      # tab shows. Both read-only here.
      MODELS_DIR: /data/models
      DOCS_DIR: /app/docs
      # Where the browser reaches the client. Used only for redirects: `/` and
      # the old server-rendered doc URLs point back into the app.
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/models:/data/models:ro
      - ./README.md:/app/docs/README.md:ro
      - ./docs/readonly-doc/backTesting-10-Getting-Started.md:/app/docs/docs/readonly-doc/backTesting-10-Getting-Started.md:ro
      # The design set, at the path the doc registry addresses it by. :ro
      # because nothing in this repo may write to the design set.
      - ./docs/readonly-doc/backTesting-01-Requirements.md:/app/docs/docs/readonly-doc/backTesting-01-Requirements.md:ro
      - ./docs/readonly-doc/backTesting-02-Features.md:/app/docs/docs/readonly-doc/backTesting-02-Features.md:ro
      - ./docs/readonly-doc/backTesting-03-Design-Notes.md:/app/docs/docs/readonly-doc/backTesting-03-Design-Notes.md:ro
      - ./docs/readonly-doc/backTesting-04-Architecture.md:/app/docs/docs/readonly-doc/backTesting-04-Architecture.md:ro

  # The React SPA, static files behind nginx. No backend of its own: it calls
  # the API by the URL baked in at build time.
  client:
    build:
      context: .
      dockerfile: web/client/Dockerfile
      args:
        # Where the browser reaches the API. Baked into the bundle at build
        # time (Vite substitutes import.meta.env at compile time), so changing
        # it means rebuilding this image, not restarting it.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
    container_name: backtest-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:3000"

  # The Java compute worker: the strategy registry, the backtest engine, the
  # walk-forward record and the ONNX check. It takes `java-compute` jobs from
  # the jobs table and has no port. The same image runs the CLI.
  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    container_name: backtest-engine
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PGHOST: timescaledb
      PGPORT: 5432
      PGDATABASE: backtest
      PGUSER: backtest
      PGPASSWORD: backtest
      # Where the worker keeps each walk-forward fold's model, with its ONNX
      # copy: the engine runs those in ONNX Runtime for the prediction check
      # (R62, G77). Read-only here.
      FOLD_MODELS_DIR: /data/fold-models
    volumes:
      - ./data/models:/data/models:ro
      - ./data/fold-models:/data/fold-models:ro

  # The Python compute worker (Architecture §2): every piece of Python work is
  # a job it takes from the jobs table and runs: imports, audits, repairs,
  # features, training, predictions, the pipeline status, walk-forward runs.
  # It serves no HTTP, so it has no port, and it fires the daily feeds refresh
  # (FEEDS_SCHEDULE). A job cut off by a restart of this container is claimed
  # again when it comes back (three attempts, then failed). The Python
  # commands in the README run in this container (`docker compose exec worker`).
  worker:
    build:
      context: .
      dockerfile: python/Dockerfile
      # The commit the image is built from, recorded with every run and feature
      # build (`git_sha`, G45). `.dockerignore` keeps .git out of the context
      # above, so it comes in as its own; see python/Dockerfile.
      additional_contexts:
        gitdir: ./.git
    container_name: backtest-worker
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PGHOST: timescaledb
      PGPORT: 5432
      PGDATABASE: backtest
      PGUSER: backtest
      PGPASSWORD: backtest
      DB_ACTOR: worker
      CSV_ARCHIVE_DIR: /data/csv-archive
      # Where an uploaded CSV waits between the API, which receives it, and
      # this worker, which imports it. Both containers mount it.
      UPLOAD_SPOOL_DIR: /data/uploads
      MODELS_DIR: /data/models
      # Keep-last-N retention for trained NN models. 0 disables retention,
      # matching the Java side's default when --keep-last-N isn't passed.
      MODEL_KEEP_LAST_N: "0"
      # Data feeds (loader/feeds, README "Data feeds"). The daily refresh runs
      # Monday to Friday at these New York times; `off` disables it. The FRED
      # key comes from the gitignored .env; without one, FRED's keyless CSV
      # endpoint is used.
      FEEDS_SCHEDULE: ${FEEDS_SCHEDULE:-18:30}
      FRED_API_KEY: ${FRED_API_KEY:-}
      NDX_CONSTITUENTS_DIR: /data/ndx-constituents
      # The SEC earnings series: SEC asks automated clients to name themselves
      # (.env.example); unset, a generic tool name is sent.
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      NDX_EARNINGS_DIR: /data/ndx-earnings
    volumes:
      # CSV archive, owned by this worker, read by anyone who needs the on-disk
      # slices (the host-side gradle path also writes here through the same mount).
      - ./data/csv-archive:/data/csv-archive
      - ./data/uploads:/data/uploads
      # Trained NN models. RW because the worker writes new versions; the
      # API mounts the same host dir read-only above.
      - ./data/models:/data/models
      # The model each walk-forward fold trained, with its scaler (G50,
      # nn/fold_models.py). Beside the registry, not in it: /api/models walks
      # that tree as strategy / cache key / version.
      - ./data/fold-models:/data/fold-models
      # Breadth members' daily closes, kept current by the feeds and read by
      # build_ndx_breadth.py on the host.
      - ./data/ndx-constituents:/data/ndx-constituents
      # The members' SEC filings (8-K dates, net income facts), kept current by
      # the feeds and read by build_ndx_earnings.py on the host.
      - ./data/ndx-earnings:/data/ndx-earnings

  # Database UI. Not part of the default stack — it sits behind the `tools`
  # profile, so `docker compose up -d` is unchanged and you ask for this one
  # explicitly:
  #
  #   docker compose --profile tools up -d pgadmin
  #
  # Then http://localhost:5050, log in as admin@backtest.local / backtest. pgAdmin
  # rejects a password under 6 characters, so this default is not `admin`. The
  # server is pre-registered from docker/pgadmin/servers.json, which pgAdmin
  # reads only when its volume is empty — on first start, or after a
  # `docker compose down -v`. Editing that file later has no effect; change
  # the connection in the UI instead.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: backtest-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@backtest.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-backtest}
      # The login above is a local credential, not a mailbox, but pgAdmin
      # validates it as a real address and refuses to start on a reserved
      # domain — `.local` is on that list, and turning off the deliverability
      # checks does not exempt it. Naming the domain here does. Nothing is
      # ever sent to the address.
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: '["local"]'
      # A local tool on a local port — the master password adds a second
      # prompt and protects nothing here.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      # pgAdmin's own settings and saved connections. Named, so the server
      # list and any saved passwords survive a restart.
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  timescaledb-data:
  pgadmin-data:
